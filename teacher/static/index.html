<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACOS 教室控制</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div>
    <div class="brand">ACOS <span>宏仁教室控制</span></div>
    <div class="sub">學生在本堂允許的數位資源內操作；老師需要說明時，只要暫時把全班注意力拉回來。</div>
  </div>
  <div class="status">
    <span id="conn" class="pill">連線中…</span>
    <span class="pill">學生在線 <b id="online">0</b>/<b id="total">0</b></span>
  </div>
</header>

<main class="layout">
  <section class="card setup">
    <div class="step">1</div>
    <div class="content">
      <h2>設定這堂課可以用什麼</h2>
      <p class="hint">只填你這堂課會用到的網站或 App。留白代表該類不限制。</p>

      <label>允許的網站 <span>一行一個網域</span>
        <textarea id="site_allow" rows="4" placeholder="例如：quizizz.com&#10;classroom.google.com"></textarea>
      </label>

      <label>允許的 App <span>一行一個名稱</span>
        <textarea id="app_allow" rows="3" placeholder="例如：Google Chrome&#10;Pages"></textarea>
      </label>

      <button id="apply" class="primary">套用到全班</button>
      <div id="applymsg" class="result"></div>
    </div>
  </section>

  <section class="card control">
    <div class="step">2</div>
    <div class="content">
      <h2>上課中，只需要這一個控制</h2>
      <p id="controlhint" class="hint">學生目前可以在你設定的範圍內操作。</p>
      <button id="focus" class="focus">請全班看老師</button>
      <p class="small">按下後學生原本的網站、App、文件都保留；再按同一顆按鈕就回到原本工作。</p>
      <button id="restore" class="restore">結束課堂／解除全部限制</button>
    </div>
  </section>

  <section class="card students">
    <div class="cardhead">
      <div>
        <h2>學生電腦</h2>
        <p class="hint">只顯示目前狀態，不需要逐台操作。</p>
      </div>
      <button id="thumbs" class="secondary">更新畫面</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <details class="card advanced">
    <summary>測試與進階設定</summary>
    <label class="check">
      <input type="checkbox" id="teachertest">
      允許這台教師機也接受學生控制（只有測試時才開）
    </label>
    <p class="warning">正式上課請保持關閉。關閉後教師機會立即解除 ACOS 控制。</p>
  </details>
</main>

<script src="/static/app.js"></script>
</body>
</html>
