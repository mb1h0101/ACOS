<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACOS 教室控制</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div>
    <div class="brand">ACOS <span>宏仁教室控制</span></div>
    <div class="sub">設定本堂課的網站與 App 使用規則。</div>
  </div>
  <div class="status">
    <span id="conn" class="pill">連線中…</span>
    <span class="pill">學生在線 <b id="online">0</b>/<b id="total">0</b></span>
  </div>
</header>

<main class="layout">
  <section class="card setup">
    <div class="content">
      <h2>本堂課使用規則</h2>

      <label>網站規則
        <select id="site_mode">
          <option value="allowlist">只允許清單內網站</option>
          <option value="blocklist">只封鎖清單內網站</option>
          <option value="off">網站不限制</option>
        </select>
      </label>
      <label>網站清單 <span>一行一個網域</span>
        <textarea id="site_list" rows="4" placeholder="例如：youtube.com&#10;quizizz.com"></textarea>
      </label>

      <label>App 規則
        <select id="app_mode">
          <option value="allowlist">只允許清單內 App</option>
          <option value="blocklist">只封鎖清單內 App</option>
          <option value="off">App 不限制</option>
        </select>
      </label>
      <label>App 清單 <span>一行一個名稱</span>
        <textarea id="app_list" rows="3" placeholder="例如：Google Chrome&#10;Messages"></textarea>
      </label>

      <button id="apply" class="primary">套用到全班</button>
      <div id="applymsg" class="result"></div>
    </div>
  </section>

  <section class="card control">
    <div class="content">
      <h2>上課中</h2>
      <p id="controlhint" class="hint">學生目前可以在你設定的範圍內操作。</p>
      <button id="focus" class="focus">請全班看老師</button>
      <p class="small">再按一次，學生就回到原本的網站、App 或文件繼續操作。</p>
      <button id="restore" class="restore">結束課堂／解除全部限制</button>
    </div>
  </section>

  <section class="card students">
    <div class="cardhead">
      <div>
        <h2>學生電腦</h2>
        <p class="hint">只顯示連線與課堂狀態。</p>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <details class="card advanced">
    <summary>測試與進階設定</summary>
    <label class="check">
      <input type="checkbox" id="teachertest">
      允許這台教師機也接受學生控制（只有測試時才開）
    </label>
    <p class="warning">正式上課請保持關閉。關閉後教師機會立即解除 ACOS 控制。</p>
  </details>
</main>

<script src="/static/app.js"></script>
</body>
</html>
